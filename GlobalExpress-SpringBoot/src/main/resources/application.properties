spring.application.name=GlobalExpress-SpringBoot

# Conexion a MySQL (base de datos creada con Base_de_datos_minimarket.sql) 
# Host localhost, puerto 3306, base minimarket, usuario root.
spring.datasource.url=jdbc:mysql://localhost:3306/minimarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}

# Las tablas ya las crea tu script SQL: Hibernate solo las usa, no las modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

server.port=8080

