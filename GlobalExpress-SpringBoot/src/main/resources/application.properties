spring.application.name=GlobalExpress-SpringBoot

# Conexion a MySQL 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Puerto del servidor
server.port=${PORT:8080}
app.cors.allowed-origins=https://globalexpress1.netlify.app

# Monitoreo (Grafana)
# Solo se publica el endpoint /actuator/prometheus, y únicamente estos indicadores de la JVM:
# CPU, memoria, subprocesos (threads) y clases. Nada más.
management.endpoints.web.exposure.include=prometheus
management.metrics.enable.all=false
management.metrics.enable.process.cpu=true
management.metrics.enable.system.cpu=true
management.metrics.enable.jvm.memory=true
management.metrics.enable.jvm.threads=true
management.metrics.enable.jvm.classes=true

# Clave con la que Grafana lee /actuator/prometheus (se envía como "Authorization: Bearer <clave>").
# Si MONITOR_TOKEN no está definida, el endpoint queda cerrado para todos.
app.monitor.token=${MONITOR_TOKEN:}
